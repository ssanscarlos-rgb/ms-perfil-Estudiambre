openapi: 3.0.3
info:
  title: ms-perfil-precios
  version: 1.0.0
  description: |
    EstudiAmbre Fase II. Perfil del usuario y radar de precios.
    Todas las rutas /v1 requieren `Authorization: Bearer <Google JWT>` (validado por APIM) y,
    en Azure, el certificado cliente de APIM. Los errores usan `{status, message, correlationId}`.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /v1/perfil:
    get:
      summary: Perfil del usuario autenticado
      tags: [Perfil]
      responses:
        '200':
          description: Perfil (con valores por defecto si aún no existe)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      summary: Editar campos del perfil (parcial)
      description: Solo `nombre`, `universidad`, `quincenaDias` y `preferencias`. `preferencias` se fusiona con las existentes.
      tags: [Perfil]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilPatch' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/precios:
    get:
      summary: Precios por tienda, del más barato al más caro
      tags: [Precios]
      parameters:
        - { name: producto, in: query, schema: { type: string }, description: Producto (sin distinguir mayúsculas ni tildes). Vacío = todos }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: Página de precios
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagePrecios' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        status: { type: integer, example: 400 }
        message: { type: string }
        correlationId: { type: string }
    Perfil:
      type: object
      properties:
        nombre: { type: string }
        universidad: { type: string }
        quincenaDias: { type: array, items: { type: integer }, example: [15, 30] }
        racha: { type: integer }
        insignias: { type: array, items: { type: string } }
        preferencias: { type: object, additionalProperties: true }
        logoUrl: { type: string, nullable: true }
    PerfilPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nombre: { type: string, maxLength: 60 }
        universidad: { type: string, maxLength: 100 }
        quincenaDias: { type: array, minItems: 1, maxItems: 2, items: { type: integer, minimum: 1, maximum: 31 } }
        preferencias: { type: object, additionalProperties: true }
    Precio:
      type: object
      properties:
        id: { type: string }
        tienda: { type: string }
        zona: { type: string }
        precio: { type: number }
        reportes: { type: integer }
    PagePrecios:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/Precio' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
