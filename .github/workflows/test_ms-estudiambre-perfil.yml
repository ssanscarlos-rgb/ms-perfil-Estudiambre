name: Build and deploy Node.js app to Azure Web App - ms-estudiambre-perfil

on:
  push:
    branches:
      - 'test'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Requerido para actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Correr pruebas
        run: npm test

      - name: Empaquetar (sin devDependencies)
        run: |
          npm prune --omit=dev
          zip -r release.zip . -x ".git/*" ".github/*" "test/*" "*.md"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Requerido para pedir el JWT de azure/login
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: "e4eb3bb9-fdcb-4237-914d-1e8d5f247ddb"
          tenant-id: "bfcf1d9d-93ea-43b1-b902-1daa68a64248"
          subscription-id: "a0ec0da7-0214-411e-84e3-d24380f1de6b"

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ms-estudiambre-perfil'
          slot-name: 'Production'
          package: release.zip
